<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Typing Test</a>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-5 text-center">
  <h2>Welcome, <span id="username"></span></h2>
  <div class="mt-4">
    <a href="typing-test.html" class="btn btn-success btn-lg me-2">Start Typing Test</a>
    <a href="history.html" class="btn btn-info btn-lg">View Score History</a>
  </div>
</div>


<script>
document.getElementById("username").innerText = localStorage.getItem("username") || "User";

function logout() {
    localStorage.clear();
    window.location.href = "index.html";
}
</script>

</body>
</html>
